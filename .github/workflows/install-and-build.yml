
name: Build MOTION TEXT PRO APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Extraire le projet Android
        run: |
          unzip -q MotionTextPro-Android-3.zip -d .
          test -f MotionTextPro/settings.gradle.kts

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler APK
        working-directory: MotionTextPro
        run: gradle assembleDebug

      - name: Récupérer APK
        uses: actions/upload-artifact@v4
        with:
          name: MOTION-TEXT-PRO-APK
          path: MotionTextPro/app/build/outputs/apk/debug/app-debug.apk
          
